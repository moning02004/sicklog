name: fevercheck

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fevercheck}
      POSTGRES_USER: ${POSTGRES_USER:-fevercheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fevercheck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: fevercheck:local
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["web"]

  scheduler:
    image: fevercheck:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: ["scheduler"]

volumes:
  pgdata:
