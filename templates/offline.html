{% extends "base.html" %}{% load sick_tags %}
{% block title %}오프라인 · 아파요{% endblock %}
{% block tabbar %}{% endblock %}
{% block content %}
<div class="min-h-dvh flex flex-col items-center justify-center gap-3 px-8 text-center">
  <span class="w-14 h-14 rounded-full bg-surface text-fg3 flex items-center justify-center">{% icon "info" 26 %}</span>
  <h1 class="text-[20px] font-bold">인터넷에 연결되어 있지 않아요</h1>
  <p class="text-[14px] text-fg2 leading-relaxed">연결되면 다시 열어 주세요. 기록은 연결된 뒤에 저장할 수 있어요.</p>
  <button class="press mt-2 px-5 py-3 rounded-2xl bg-accent text-onaccent font-semibold" onclick="location.reload()">다시 시도</button>
</div>
{% endblock %}
