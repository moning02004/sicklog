{% load sick_tags %}<div class="flex flex-wrap gap-1.5">{% for s in symptoms %}{% if s|is_complication %}<span class="px-2.5 py-1 rounded-lg bg-warnsoft text-[13px] font-semibold text-warn">{{ s }}</span>{% else %}<span class="px-2.5 py-1 rounded-lg bg-surface2 text-[13px] font-semibold text-fg2">{{ s }}</span>{% endif %}{% endfor %}</div>
