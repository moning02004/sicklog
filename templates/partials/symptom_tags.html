{% load sick_tags %}{# edit_url을 주면 끝에 '수정'(증상이 없으면 '+ 증상 추가') 칩을 붙인다 #}<div class="flex flex-wrap gap-1.5">{% for s in symptoms %}{% if s|is_complication %}<span class="px-2.5 py-1 rounded-lg bg-warnsoft text-[13px] font-semibold text-warn">{{ s }}</span>{% else %}<span class="px-2.5 py-1 rounded-lg bg-surface2 text-[13px] font-semibold text-fg2">{{ s }}</span>{% endif %}{% endfor %}{% if edit_url %}<a href="{{ edit_url }}" class="press px-2.5 py-1 rounded-lg border border-dashed border-line text-[13px] font-semibold text-accent flex items-center gap-1">{% if symptoms %}{% icon "edit" 13 %}수정{% else %}{% icon "plus" 13 2.4 %}증상 추가{% endif %}</a>{% endif %}</div>
