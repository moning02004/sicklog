{% load sick_tags %}{% for day, items in groups %}
<section class="card px-5 pt-4 pb-1">
  <h2 class="eyebrow mb-1">{% if day == today %}오늘 · {% elif day == yesterday %}어제 · {% endif %}{{ day|day }} ({{ day|dow }})</h2>
  <div class="divide-y divide-[var(--line)]">{% for r in items %}{% include "partials/record_row.html" %}{% endfor %}</div>
</section>
{% empty %}
<div class="card p-8 text-center text-fg3 text-[14px]">{{ empty_text|default:"기록이 없어요" }}</div>
{% endfor %}
