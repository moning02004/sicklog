<div class="flex flex-col gap-2" data-time-field data-mode="{{ mode|default:'time' }}" data-days="{{ days|default:2 }}" data-title="{{ picker_title|default:label }}"{% if initial %} data-initial="{% if mode == 'date' %}{{ initial|date:'Y-m-d' }}{% else %}{{ initial|date:'c' }}{% endif %}"{% endif %}>
  <span class="eyebrow">{{ label }}</span>
  <button type="button" class="press w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-surface2" data-time-button aria-label="{{ label }} 바꾸기">
    <span class="text-[14px] font-semibold text-fg3" data-time-day hidden></span><span class="text-[22px] font-bold num" data-time-text></span>
  </button>
  <input type="hidden" name="{{ name }}" data-time-input>
  {% if hint %}<p class="text-[12px] text-fg3">{{ hint }}</p>{% endif %}
</div>
