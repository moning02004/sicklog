{% load sick_tags %}<form class="sheet modal" id="sheet-check" method="post" action="{% url 'illness_check' illness.pk %}" data-ajax="reload" role="dialog" aria-modal="true" aria-label="컨디션 기록">
  {% csrf_token %}
  <div class="p-6 flex flex-col gap-4">
    <div class="flex items-center justify-between">
      <div><h3 class="text-[20px] font-bold">컨디션은 어떤가요?</h3><p class="text-[13px] text-fg3">해당하는 것만 눌러요. 모르면 비워 둬도 괜찮아요</p></div>
      <button type="button" class="w-9 h-9 rounded-full bg-surface2 flex items-center justify-center text-fg2" data-close-sheet aria-label="닫기">{% icon "x" 18 %}</button>
    </div>
    <div class="flex flex-col gap-2">
      {% for field, options in check_answers %}
      <div class="grid {% if options|length == 3 %}grid-cols-3{% else %}grid-cols-2{% endif %} gap-2">
        {% for value, label, tone in options %}
        <button type="button" class="press py-3 px-1 rounded-xl bg-surface2 text-fg2 text-[14px] font-semibold leading-tight" data-check-item="{{ field }}" data-check-value="{{ value }}" data-check-tone="{{ tone }}">{{ label }}</button>
        {% endfor %}
        <input type="hidden" name="{{ field }}" data-check-input="{{ field }}">
      </div>
      {% endfor %}
    </div>
    <label class="sr-only" for="check-memo">메모</label>
    <input class="field !py-3 !text-[15px]" id="check-memo" name="memo" maxlength="200" placeholder="메모 (선택) 예: 낮잠을 길게 잤어요" autocomplete="off" data-check-memo>
    <button class="press py-4 rounded-2xl bg-accent text-onaccent font-semibold text-[16px]">저장하기</button>
  </div>
</form>
{{ check_data|json_script:"check-data" }}
