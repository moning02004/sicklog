{% load sick_tags %}<form class="sheet" id="sheet-cure" method="post" action="{% url 'illness_cure' illness.pk %}" data-ajax="reload" role="dialog" aria-modal="true" aria-label="완치로 기록">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="w-10 h-1.5 rounded-full bg-line mx-auto mt-2.5"></div>
  <div class="p-6 flex flex-col gap-5">
    <div class="flex items-center justify-between"><h3 class="text-[20px] font-bold">완치로 기록</h3>
      <button type="button" class="w-9 h-9 rounded-full bg-surface2 flex items-center justify-center text-fg2" data-close-sheet aria-label="닫기">{% icon "x" 18 %}</button></div>
    <div class="rounded-2xl bg-oksoft p-4 flex flex-col gap-1">
      <p class="text-[15px] font-bold text-ok">{{ illness.title }} · {{ illness.days }}일째</p>
      <p class="text-[14px] text-fg2 leading-relaxed">다 나은 날과 오전·오후를 골라 주세요. 며칠 뒤에 기록해도 그때로 남길 수 있어요.</p>
    </div>
    {% include "partials/time_field.html" with name="cured_at" label="다 나은 때" picker_title="다 나은 때" days=30 mode="half" min=illness.started_at %}
    <button class="press py-4 rounded-2xl bg-ok text-white font-semibold text-[16px]">완치로 기록</button>
  </div>
</form>
