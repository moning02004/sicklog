{% load sick_tags %}<div class="sheet modal" id="sheet-notes" role="dialog" aria-modal="true" aria-label="메모 모두 보기">
  <div class="p-6 flex flex-col gap-1">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-[20px] font-bold">메모</h3>
      <button type="button" class="w-9 h-9 rounded-full bg-surface2 flex items-center justify-center text-fg2" data-close-sheet aria-label="닫기">{% icon "x" 18 %}</button>
    </div>
    {% for n in notes %}
    {% ifchanged n.recorded_at|date:"Ymd" %}<p class="eyebrow pt-3 pb-1">{{ n.recorded_at|day }} ({{ n.recorded_at|dow }})</p>{% endifchanged %}
    <div class="flex flex-col border-t border-line" data-row>
      <div class="flex items-start gap-3 py-2.5">
        <span class="w-11 flex-none text-[13px] text-fg3 num pt-0.5">{{ n.recorded_at|date:"H:i" }}</span>
        <p class="flex-1 min-w-0 text-[14px] whitespace-pre-line break-words">{{ n.text }}</p>
        <button type="button" class="flex-none w-8 h-8 -mt-1 rounded-full text-fg3 flex items-center justify-center" data-row-delete aria-label="{{ n.recorded_at|when }} 메모 지우기">{% icon "trash" 16 %}</button>
      </div>
      <form method="post" action="{% url 'note_delete' n.pk %}" class="flex items-center justify-end gap-2 pb-2.5" data-ajax="reload" data-row-confirm hidden>
        {% csrf_token %}
        <span class="text-[13px] text-fg2 mr-auto">이 메모를 지울까요?</span>
        <button type="button" class="press px-3 py-1.5 rounded-lg bg-surface2 text-[13px] font-semibold" data-row-cancel>취소</button>
        <button class="press px-3 py-1.5 rounded-lg bg-hot text-white text-[13px] font-semibold">지우기</button>
      </form>
    </div>
    {% endfor %}
  </div>
</div>
