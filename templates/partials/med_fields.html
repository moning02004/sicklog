{% load sick_tags %}    <div class="grid grid-cols-3 gap-2">
      {% for key, d in drugs.items %}
      <label class="block">
        <input type="radio" name="drug" value="{{ key }}" class="sr-only" data-drug-radio{% if key == drug_value %} checked{% endif %}>
        <span class="press rounded-2xl p-3 flex flex-col items-start gap-1.5 border-2 border-transparent bg-surface2 cursor-pointer" data-drug-card="{{ key }}">
          <span class="w-2.5 h-2.5 rounded-full bg-{{ d.cls }}"></span><span class="font-bold text-[14px]">{{ d.name }}</span><span class="text-[11px] text-fg3">{{ d.mg_per_ml }}mg/mL</span>
        </span>
      </label>
      {% endfor %}
    </div>
    {% if show_note %}<div data-med-note></div>{% endif %}
    <div class="flex flex-col gap-2">
      <span class="eyebrow">먹인 양</span>
      <div class="flex items-center gap-3">
        <button type="button" class="press w-12 h-12 rounded-full bg-surface2 flex items-center justify-center" data-ml-step="-0.5" aria-label="0.5mL 줄이기">{% icon "minus" 20 %}</button>
        <p class="flex-1 text-center"><span class="text-[40px] font-bold num" data-ml-value></span><span class="text-[18px] font-semibold text-fg3 ml-1">mL</span>
          <span class="block text-[12px] text-fg3 num" data-mg-value></span></p>
        <button type="button" class="press w-12 h-12 rounded-full bg-surface2 flex items-center justify-center" data-ml-step="0.5" aria-label="0.5mL 늘리기">{% icon "plus" 20 %}</button>
      </div>
      <label class="sr-only" for="ml-range">먹인 양</label>
      <input type="range" class="range my-2" id="ml-range" min="0.5" max="15" step="0.1" data-ml-slider>
      <input type="hidden" name="amount_ml" data-ml-input{% if ml_value %} data-initial-ml="{{ ml_value }}"{% endif %}>
      <div class="rounded-xl bg-surface2 px-3.5 py-2.5 text-[12px] text-fg2 num flex justify-between gap-2"><span data-ml-range></span><span class="text-fg3">라벨 확인 필수</span></div>
    </div>
